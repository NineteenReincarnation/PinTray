name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native Win32 x64
        shell: cmd
        run: |
          for /f "delims=" %%I in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%I"
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if not exist artifacts\build mkdir artifacts\build
          if not exist artifacts\publish mkdir artifacts\publish
          rc /nologo /fo artifacts\build\PinTray.res src\PinTray.rc
          cl /nologo /std:c++20 /O1 /GL /MT /EHsc /W4 /D_WIN32_WINNT=0x0A00 src\main.cpp artifacts\build\PinTray.res /Foartifacts\build\ /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /LTCG /OPT:REF /OPT:ICF /MANIFEST:NO /OUT:artifacts\publish\PinTray.exe user32.lib shell32.lib advapi32.lib dwmapi.lib

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PinTray-portable-win-x64
          path: artifacts/publish/
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build per-user installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\PinTray.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PinTray-installer-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
